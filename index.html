<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasileirão CDE</title>
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f1a2e;
            --bg-secondary: #1a2a44;
            --bg-card: #243b5a;
            --bg-modal: rgba(15, 26, 46, 0.92);
            --gold: #d4af37;
            --gold-light: #f0d060;
            --gold-dark: #b8952a;
            --green: #2ecc71;
            --green-dark: #1a9c54;
            --red: #e74c3c;
            --red-dark: #c0392b;
            --orange: #f39c12;
            --text-primary: #f0f4f8;
            --text-secondary: #b0c4de;
            --text-muted: #7f8fa6;
            --border-color: #2c3e6b;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 12px;
            --radius-sm: 6px;
            --transition: 0.25s ease;
            --font: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        html,
        body {
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font);
            overflow: hidden;
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold-dark);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold);
        }

        /* ========== APP LAYOUT ========== */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        /* ========== HEADER ========== */
        header {
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--gold-dark);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-left .logo-placeholder {
            width: 48px;
            height: 48px;
            background: var(--gold-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: var(--bg-primary);
            letter-spacing: -0.5px;
        }

        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-left h1 span {
            font-weight: 300;
            font-size: 14px;
            -webkit-text-fill-color: var(--text-secondary);
            margin-left: 6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-right .round-info {
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--bg-primary);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--red-dark);
            color: var(--red);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-reset:hover {
            background: var(--red-dark);
            color: #fff;
        }

        /* ========== TABS ========== */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-primary);
            padding: 4px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(212, 175, 55, 0.08);
        }
        .tab-btn.active {
            background: var(--gold-dark);
            color: var(--bg-primary);
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
        }
        .tab-btn.active:hover {
            background: var(--gold);
        }

        /* ========== MAIN CONTENT ========== */
        main {
            flex: 1;
            overflow: hidden;
            padding: 16px 20px 20px 20px;
            background: var(--bg-primary);
        }

        .tab-content {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .tab-content.active {
            display: flex;
        }

        /* ========== TABLE TAB ========== */
        .table-wrapper {
            flex: 1;
            overflow: auto;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 4px 0 4px 4px;
            position: relative;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 950px;
        }

        .table-wrapper th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg-secondary);
            color: var(--gold-light);
            font-weight: 700;
            padding: 10px 6px;
            text-align: center;
            border-bottom: 2px solid var(--gold-dark);
            font-size: 12px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .table-wrapper th:first-child {
            min-width: 44px;
            z-index: 12;
            left: 0;
            background: var(--bg-secondary);
        }
        .table-wrapper th:nth-child(2) {
            text-align: left;
            padding-left: 12px;
            min-width: 180px;
            z-index: 12;
            left: 44px;
            background: var(--bg-secondary);
        }
        /* Total agora é a 3ª coluna (depois do nome) */
        .table-wrapper th:nth-child(3) {
            min-width: 50px;
            background: var(--bg-secondary);
            color: var(--gold);
            font-size: 13px;
        }

        .table-wrapper td {
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            transition: var(--transition);
        }

        /* Coluna de posição */
        .table-wrapper td:first-child {
            position: sticky;
            left: 0;
            z-index: 5;
            background: var(--bg-secondary);
            font-weight: 700;
            font-size: 14px;
            min-width: 44px;
        }
        .table-wrapper td:nth-child(2) {
            position: sticky;
            left: 44px;
            z-index: 5;
            background: var(--bg-secondary);
            text-align: left;
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 180px;
            border-right: 1px solid var(--border-color);
        }
        .table-wrapper td:nth-child(2) .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            flex-shrink: 0;
        }
        .table-wrapper td:nth-child(2) .team-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
        }

        .table-wrapper tr:hover td {
            background: rgba(212, 175, 55, 0.04);
        }
        .table-wrapper tr:hover td:first-child,
        .table-wrapper tr:hover td:nth-child(2) {
            background: rgba(212, 175, 55, 0.08);
        }

        /* Setas de posição */
        .pos-arrow {
            display: inline-block;
            font-size: 16px;
            margin-left: 4px;
        }
        .pos-arrow.up { color: var(--green); }
        .pos-arrow.down { color: var(--red); }
        .pos-arrow.same { color: var(--text-muted); }

        /* ---- Score cell ---- */
        .score-cell {
            cursor: pointer;
            border-radius: var(--radius-sm);
            padding: 6px 4px;
            min-width: 36px;
            transition: var(--transition);
            font-weight: 700;
            font-size: 14px;
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .score-cell:hover {
            transform: scale(1.05);
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.2);
        }

        .score-cell .pts {
            font-size: 16px;
        }
        .score-cell .card-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 4px;
            vertical-align: middle;
            background: var(--gold);
            box-shadow: 0 0 6px rgba(212, 175, 55, 0.5);
        }
        .score-cell .card-badge.warning {
            background: var(--orange);
            box-shadow: 0 0 8px rgba(243, 156, 18, 0.6);
        }
        .score-cell .card-badge.danger {
            background: var(--red);
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.7);
        }

        /* score colors (apenas estético) */
        .score-0 {
            background: rgba(231, 76, 60, 0.15);
            color: var(--red);
        }
        .score-1 {
            background: rgba(243, 156, 18, 0.15);
            color: var(--orange);
        }
        .score-2 {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-light);
        }
        .score-3 {
            background: rgba(46, 204, 113, 0.15);
            color: var(--green);
        }

        /* Total (agora na 3ª coluna) com destaque */
        .table-wrapper .total-col {
            font-weight: 800;
            font-size: 16px;
            color: var(--gold);
            min-width: 50px;
            background: rgba(212, 175, 55, 0.08);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        /* ========== LINEUP TAB ========== */
        .lineup-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            overflow-y: auto;
            padding: 4px 2px 12px 2px;
            flex: 1;
            align-content: start;
        }

        .lineup-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 16px 18px 18px 18px;
            transition: var(--transition);
        }
        .lineup-card:hover {
            border-color: var(--gold-dark);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .lineup-card .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .lineup-card .card-header img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
        }

        .lineup-card .card-header h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--gold-light);
        }

        .lineup-card .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
        }

        .lineup-card .player-list .player-tag {
            font-size: 12px;
            background: var(--bg-primary);
            padding: 2px 10px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .lineup-card .player-list .player-tag.captain {
            border-color: var(--gold);
            color: var(--gold-light);
            font-weight: 600;
        }
        .lineup-card .player-list .player-tag.captain::after {
            content: ' ⚽';
            font-size: 10px;
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-modal);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--gold-dark);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 32px 32px 32px;
            box-shadow: var(--shadow);
            animation: modalFade 0.2s ease;
        }

        @keyframes modalFade {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .modal-box .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold-light);
        }
        .modal-box .modal-header h2 small {
            font-weight: 400;
            font-size: 15px;
            color: var(--text-secondary);
            margin-left: 8px;
        }

        .modal-box .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            padding: 0 6px;
            transition: var(--transition);
        }
        .modal-box .modal-close:hover {
            color: var(--red);
            transform: rotate(90deg);
        }

        /* ---- Scores in modal ---- */
        .modal-scores {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }

        .modal-scores .score-group {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .modal-scores .score-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .modal-scores .score-group .score-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .modal-scores .score-group .score-control button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-scores .score-group .score-control button:hover {
            border-color: var(--gold);
            background: var(--gold-dark);
            color: var(--bg-primary);
        }
        .modal-scores .score-group .score-control button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .modal-scores .score-group .score-control .score-val {
            font-size: 26px;
            font-weight: 700;
            min-width: 32px;
            color: var(--gold-light);
        }

        /* ---- Cards in modal ---- */
        .modal-cards {
            margin-top: 6px;
        }

        .modal-cards .cards-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-cards .cards-title .badge-total {
            background: var(--gold-dark);
            color: var(--bg-primary);
            padding: 0 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
        }
        .modal-cards .cards-title .badge-total.danger {
            background: var(--red);
        }

        .modal-cards .player-card-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
            align-items: center;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: var(--transition);
        }
        .modal-cards .player-card-row:hover {
            border-color: var(--border-color);
        }

        .modal-cards .player-card-row .pname {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-cards .player-card-row .pname.captain {
            color: var(--gold-light);
        }

        .modal-cards .player-card-row .card-ctrl {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }

        .modal-cards .player-card-row .card-ctrl button {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .modal-cards .player-card-row .card-ctrl button:hover {
            border-color: var(--gold);
            background: var(--gold-dark);
            color: var(--bg-primary);
        }
        .modal-cards .player-card-row .card-ctrl button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .modal-cards .player-card-row .card-ctrl .card-count {
            font-size: 15px;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
            color: var(--gold-light);
        }
        .modal-cards .player-card-row .card-ctrl .card-count.warning {
            color: var(--orange);
        }
        .modal-cards .player-card-row .card-ctrl .card-count.danger {
            color: var(--red);
        }

        .modal-cards .player-card-row .crit-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            text-align: center;
        }

        /* ---- Modal footer ---- */
        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal-footer .btn-close-modal {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }
        .modal-footer .btn-close-modal:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .modal-footer .btn-save-modal {
            background: var(--gold-dark);
            border: none;
            color: var(--bg-primary);
            padding: 8px 28px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: var(--transition);
        }
        .modal-footer .btn-save-modal:hover {
            background: var(--gold);
            transform: scale(1.02);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            header {
                padding: 10px 14px;
            }
            .header-left h1 {
                font-size: 17px;
            }
            .header-left .logo-placeholder {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            .tab-btn {
                padding: 6px 14px;
                font-size: 12px;
            }
            main {
                padding: 10px 10px 12px 10px;
            }
            .modal-box {
                padding: 20px 16px;
            }
            .modal-scores {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }
            .modal-cards .player-card-row {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 4px;
                font-size: 12px;
            }
            .modal-cards .player-card-row .crit-label {
                display: none;
            }
            .lineup-grid {
                grid-template-columns: 1fr 1fr;
            }
            .table-wrapper td:nth-child(2) {
                min-width: 120px;
                font-size: 11px;
            }
            .table-wrapper td:nth-child(2) .team-logo {
                width: 22px;
                height: 22px;
            }
            .score-cell {
                font-size: 12px;
                min-width: 28px;
                padding: 4px 2px;
            }
            .table-wrapper th {
                font-size: 10px;
                padding: 6px 3px;
            }
            .table-wrapper th:first-child {
                min-width: 30px;
            }
            .table-wrapper th:nth-child(2) {
                min-width: 120px;
                left: 30px;
            }
            .table-wrapper td:first-child {
                min-width: 30px;
                font-size: 12px;
            }
            .table-wrapper td:nth-child(2) {
                left: 30px;
                min-width: 120px;
            }
            .table-wrapper .total-col {
                font-size: 14px;
                min-width: 40px;
            }
        }

        @media (max-width: 480px) {
            .lineup-grid {
                grid-template-columns: 1fr;
            }
            .header-left h1 span {
                display: none;
            }
            .header-right .round-info {
                font-size: 11px;
                padding: 2px 10px;
            }
            .modal-scores {
                grid-template-columns: 1fr;
            }
            .modal-cards .player-card-row {
                grid-template-columns: 1fr 1fr;
            }
            .modal-cards .player-card-row .crit-label {
                display: none;
            }
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            border: 1px solid var(--gold-dark);
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            text-align: center;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast .highlight {
            color: var(--gold-light);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- ===== APP ===== -->
    <div id="app">

        <!-- HEADER -->
        <header>
            <div class="header-left">
                <div class="logo-placeholder">CDE</div>
                <h1>Brasileirão <span>CDE 2026</span></h1>
            </div>
            <div class="header-right">
                <span class="round-info" id="roundInfo">21 rodadas</span>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="table">📊 Tabela</button>
                    <button class="tab-btn" data-tab="lineup">👥 Escalação</button>
                </div>
                <button class="btn-reset" id="resetBtn">↺ Reiniciar</button>
            </div>
        </header>

        <!-- MAIN -->
        <main>
            <!-- TAB: TABLE -->
            <section id="tab-table" class="tab-content active">
                <div class="table-wrapper" id="tableWrapper">
                    <table id="mainTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- TAB: LINEUP -->
            <section id="tab-lineup" class="tab-content">
                <div class="lineup-grid" id="lineupGrid"></div>
            </section>
        </main>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">Time <small>Rodada 1</small></h2>
                <button class="modal-close" id="modalCloseBtn">&times;</button>
            </div>

            <!-- Scores -->
            <div class="modal-scores" id="modalScores">
                <div class="score-group" data-crit="assiduidade">
                    <label>📋 Assiduidade</label>
                    <div class="score-control">
                        <button class="score-dec" data-crit="assiduidade">−</button>
                        <span class="score-val" id="scoreAssiduidade">0</span>
                        <button class="score-inc" data-crit="assiduidade">+</button>
                    </div>
                </div>
                <div class="score-group" data-crit="performance">
                    <label>⚡ Performance</label>
                    <div class="score-control">
                        <button class="score-dec" data-crit="performance">−</button>
                        <span class="score-val" id="scorePerformance">0</span>
                        <button class="score-inc" data-crit="performance">+</button>
                    </div>
                </div>
                <div class="score-group" data-crit="seguranca">
                    <label>🛡️ Segurança</label>
                    <div class="score-control">
                        <button class="score-dec" data-crit="seguranca">−</button>
                        <span class="score-val" id="scoreSeguranca">0</span>
                        <button class="score-inc" data-crit="seguranca">+</button>
                    </div>
                </div>
            </div>

            <!-- Cards -->
            <div class="modal-cards" id="modalCards">
                <div class="cards-title">
                    <span>🟨 Cartões Amarelos</span>
                    <span class="badge-total" id="cardTotalBadge">0</span>
                    <span style="font-size:12px;color:var(--text-muted);font-weight:400;">
                        (apenas indicador – não afeta os pontos)
                    </span>
                </div>
                <div id="playerCardList"></div>
            </div>

            <div class="modal-footer">
                <button class="btn-close-modal" id="modalCloseBtn2">Fechar</button>
                <button class="btn-save-modal" id="modalSaveBtn">✓ Salvar</button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ========================================================================
        //  DATA
        // ========================================================================

        const TEAMS_DATA = [{
            id: 'apfc',
            name: 'Acabamento Perfeito FC',
            logo: 'apfc.png',
            players: ['João Batista (Capitão)', 'Leandro', 'Mario', 'Diogo', 'Reiner', 'Doglas', 'G. Monteiro', 'Izaque']
        }, {
            id: 'bgfc',
            name: 'Bigode Glass FC',
            logo: 'bgfc.png',
            players: ['Jordan (Capitão)', 'Eder', 'Pedro Paulo', 'V. Moraes']
        }, {
            id: 'crcc',
            name: 'CR Corte Certo',
            logo: 'crcc.png',
            players: ['Gustavo (Capitão)', 'Victor Barbosa', 'Gleison', 'Flaviano', 'Lucas Apocino']
        }, {
            id: 'egfc',
            name: 'Eco Glass FC',
            logo: 'egfc.png',
            players: ['Valdeilson (Capitão)', 'Emerson', 'Jose']
        }, {
            id: 'crfe',
            name: 'CR Fluxo Eficiente',
            logo: 'crfe.png',
            players: ['Rizo (Capitão)', 'Marlesson', 'Delmario', 'David', 'Raimundo']
        }, {
            id: 'gefc',
            name: 'Guardiões do Estoque FC',
            logo: 'gefc.png',
            players: ['Jackson (Capitão)', 'Leila', 'Wanderson', 'Vitor', 'William']
        }, {
            id: 'crmg',
            name: 'CR Master Glass',
            logo: 'crmg.png',
            players: ['Andrei (Capitão)', 'Andrei', 'Moiseis', 'Juan*', 'Marcelo']
        }, {
            id: 'rcfc',
            name: 'Rota Certa FC',
            logo: 'rcfc.png',
            players: ['Gabriele (Capitã)', 'Geovane', 'Melo', 'Akiro', 'Marcos', 'Romoaldo', 'Samuel']
        }, {
            id: 'sifc',
            name: 'Samos Irmões FC',
            logo: 'sifc.png',
            players: ['Thaymon (Capitão)', 'Anthony', 'Lucas', 'Rosenildo', 'Josafa', 'Anderson', 'Fernanda']
        }, {
            id: 'tfc',
            name: 'Temper FC',
            logo: 'tfc.png',
            players: ['Weliton (Capitão)', 'Miqueias', 'João', 'Tiago']
        }];

        const ROUNDS = 21;
        const CRITERIA = ['assiduidade', 'performance', 'seguranca'];

        // ========================================================================
        //  STATE
        // ========================================================================

        let state = null;
        let currentModal = { teamId: null, round: null };

        // ========================================================================
        //  STORAGE
        // ========================================================================

        function loadState() {
            const raw = localStorage.getItem('brasileirao_cde_state');
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    let valid = true;
                    for (const t of TEAMS_DATA) {
                        if (!parsed.scores[t.id]) valid = false;
                        if (!parsed.cards[t.id]) valid = false;
                        if (!parsed.meta) valid = false;
                    }
                    if (valid) return parsed;
                } catch (_) { /* ignore */ }
            }
            return null;
        }

        function saveState() {
            localStorage.setItem('brasileirao_cde_state', JSON.stringify(state));
        }

        function initState() {
            const scores = {};
            const cards = {};
            for (const t of TEAMS_DATA) {
                scores[t.id] = {};
                cards[t.id] = {};
                for (let r = 1; r <= ROUNDS; r++) {
                    scores[t.id][r] = { assiduidade: 0, performance: 0, seguranca: 0 };
                    cards[t.id][r] = {};
                    for (const p of t.players) {
                        cards[t.id][r][p] = { assiduidade: 0, performance: 0, seguranca: 0 };
                    }
                }
            }
            return { scores, cards, meta: { version: '1.0' } };
        }

        function getState() {
            const s = loadState();
            if (s) {
                for (const t of TEAMS_DATA) {
                    for (let r = 1; r <= ROUNDS; r++) {
                        if (!s.cards[t.id]) s.cards[t.id] = {};
                        if (!s.cards[t.id][r]) s.cards[t.id][r] = {};
                        for (const p of t.players) {
                            if (!s.cards[t.id][r][p]) {
                                s.cards[t.id][r][p] = { assiduidade: 0, performance: 0, seguranca: 0 };
                            }
                        }
                        if (!s.scores[t.id]) s.scores[t.id] = {};
                        if (!s.scores[t.id][r]) {
                            s.scores[t.id][r] = { assiduidade: 0, performance: 0, seguranca: 0 };
                        }
                    }
                }
                return s;
            }
            const fresh = initState();
            saveState();
            return fresh;
        }

        // ========================================================================
        //  HELPERS
        // ========================================================================

        function getTeamById(id) { return TEAMS_DATA.find(t => t.id === id); }

        function isCaptain(teamId, playerName) {
            const t = getTeamById(teamId);
            if (!t) return false;
            return t.players.includes(playerName) && (playerName.includes('(Capitão)') || playerName.includes('(Capitã)'));
        }

        function getTotalCardsForTeamRound(teamId, round) {
            const c = state.cards[teamId]?.[round];
            if (!c) return 0;
            let total = 0;
            for (const p of Object.values(c)) {
                for (const crit of CRITERIA) {
                    total += (p[crit] || 0);
                }
            }
            return total;
        }

        function getScore(teamId, round, criterion) {
            const s = state.scores[teamId]?.[round];
            if (!s) return 0;
            return s[criterion] || 0;
        }

        function setScore(teamId, round, criterion, val) {
            if (!state.scores[teamId]) state.scores[teamId] = {};
            if (!state.scores[teamId][round]) state.scores[teamId][round] = { assiduidade: 0, performance: 0, seguranca: 0 };
            state.scores[teamId][round][criterion] = Math.max(0, Math.min(3, val));
            saveState();
        }

        function setCard(teamId, round, player, criterion, val) {
            if (!state.cards[teamId]) state.cards[teamId] = {};
            if (!state.cards[teamId][round]) state.cards[teamId][round] = {};
            if (!state.cards[teamId][round][player]) {
                state.cards[teamId][round][player] = { assiduidade: 0, performance: 0, seguranca: 0 };
            }
            state.cards[teamId][round][player][criterion] = Math.max(0, Math.min(3, val));
            saveState();
        }

        function getTotalPoints(teamId, round) {
            let sum = 0;
            for (const crit of CRITERIA) {
                sum += getScore(teamId, round, crit);
            }
            return sum;
        }

        function getTeamTotal(teamId) {
            let total = 0;
            for (let r = 1; r <= ROUNDS; r++) {
                total += getTotalPoints(teamId, r);
            }
            return total;
        }

        // ========================================================================
        //  RANKING CALC
        // ========================================================================

        function getRanking(round) {
            const arr = TEAMS_DATA.map(t => ({
                teamId: t.id,
                totalPoints: 0
            }));
            const withTotal = arr.map(item => {
                let sum = 0;
                for (let r = 1; r <= round; r++) {
                    sum += getTotalPoints(item.teamId, r);
                }
                return { teamId: item.teamId, totalPoints: sum };
            });
            withTotal.sort((a, b) => {
                if (a.totalPoints !== b.totalPoints) return b.totalPoints - a.totalPoints;
                const nameA = getTeamById(a.teamId).name;
                const nameB = getTeamById(b.teamId).name;
                return nameA.localeCompare(nameB);
            });
            return withTotal.map((item, index) => ({
                ...item,
                rank: index + 1
            }));
        }

        // ========================================================================
        //  RENDER: TABLE
        // ========================================================================

        function renderTable() {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');

            // Cabeçalho: Pos, Time, Total, depois as rodadas
            let headHtml = '<tr><th>Pos</th><th>Time</th><th>Total</th>';
            for (let r = 1; r <= ROUNDS; r++) {
                headHtml += `<th>${r}</th>`;
            }
            headHtml += '</tr>';
            thead.innerHTML = headHtml;

            const rankings = {};
            for (let r = 1; r <= ROUNDS; r++) {
                rankings[r] = getRanking(r);
            }

            const currentRanking = rankings[ROUNDS];
            const sortedTeamIds = currentRanking.map(item => item.teamId);

            let bodyHtml = '';
            for (const teamId of sortedTeamIds) {
                const team = getTeamById(teamId);
                const currentPos = currentRanking.find(item => item.teamId === teamId).rank;
                let arrow = '';
                if (ROUNDS > 1) {
                    const prevRanking = rankings[ROUNDS - 1];
                    const prevPos = prevRanking.find(item => item.teamId === teamId).rank;
                    if (prevPos < currentPos) {
                        arrow = '<span class="pos-arrow down">▼</span>';
                    } else if (prevPos > currentPos) {
                        arrow = '<span class="pos-arrow up">▲</span>';
                    } else {
                        arrow = '<span class="pos-arrow same">—</span>';
                    }
                } else {
                    arrow = '<span class="pos-arrow same">—</span>';
                }

                bodyHtml += `<tr>`;
                bodyHtml += `<td>${currentPos} ${arrow}</td>`;

                // Coluna do time
                bodyHtml += `<td>
                    <img class="team-logo" src="${team.logo}" alt="${team.name}" 
                         onerror="this.style.display='none'" />
                    <span class="team-name">${team.name}</span>
                </td>`;

                // Total (agora antes das rodadas)
                const total = getTeamTotal(teamId);
                bodyHtml += `<td class="total-col">${total}</td>`;

                // Rodadas
                for (let r = 1; r <= ROUNDS; r++) {
                    const pts = getTotalPoints(teamId, r);
                    const cardTotal = getTotalCardsForTeamRound(teamId, r);
                    let cls = 'score-cell';
                    if (pts === 0) cls += ' score-0';
                    else if (pts === 1) cls += ' score-1';
                    else if (pts === 2) cls += ' score-2';
                    else if (pts === 3) cls += ' score-3';

                    let badge = '';
                    if (cardTotal > 0) {
                        const bcls = cardTotal >= 2 ? 'danger' : (cardTotal === 1 ? 'warning' : '');
                        badge = `<span class="card-badge ${bcls}"></span>`;
                    }

                    bodyHtml += `<td>
                        <div class="${cls}" data-team="${teamId}" data-round="${r}">
                            <span class="pts">${pts}</span>
                            ${badge}
                        </div>
                    </td>`;
                }

                bodyHtml += '</tr>';
            }

            tbody.innerHTML = bodyHtml;

            document.querySelectorAll('.score-cell').forEach(el => {
                el.addEventListener('click', function() {
                    const teamId = this.dataset.team;
                    const round = parseInt(this.dataset.round);
                    openModal(teamId, round);
                });
            });
        }

        // ========================================================================
        //  RENDER: LINEUP
        // ========================================================================

        function renderLineup() {
            const grid = document.getElementById('lineupGrid');
            let html = '';
            for (const team of TEAMS_DATA) {
                html += `<div class="lineup-card">
                    <div class="card-header">
                        <img src="${team.logo}" alt="${team.name}" 
                             onerror="this.style.display='none'" />
                        <h3>${team.name}</h3>
                    </div>
                    <div class="player-list">`;
                for (const p of team.players) {
                    const isCap = p.includes('(Capitão)') || p.includes('(Capitã)');
                    html += `<span class="player-tag ${isCap ? 'captain' : ''}">${p}</span>`;
                }
                html += `</div></div>`;
            }
            grid.innerHTML = html;
        }

        // ========================================================================
        //  MODAL
        // ========================================================================

        function openModal(teamId, round) {
            currentModal.teamId = teamId;
            currentModal.round = round;
            const team = getTeamById(teamId);
            if (!team) return;

            document.getElementById('modalTitle').innerHTML =
                `${team.name} <small>Rodada ${round}</small>`;

            for (const crit of CRITERIA) {
                const val = getScore(teamId, round, crit);
                const el = document.getElementById(`score${crit.charAt(0).toUpperCase() + crit.slice(1)}`);
                if (el) el.textContent = val;
            }

            const list = document.getElementById('playerCardList');
            let cardHtml = '';
            let totalCards = 0;

            for (const p of team.players) {
                const pCards = state.cards[teamId]?.[round]?.[p] || { assiduidade: 0, performance: 0, seguranca: 0 };
                const pTotal = (pCards.assiduidade || 0) + (pCards.performance || 0) + (pCards.seguranca || 0);
                totalCards += pTotal;
                const isCap = isCaptain(teamId, p);

                cardHtml += `<div class="player-card-row">
                    <span class="pname ${isCap ? 'captain' : ''}">${p}</span>`;

                for (const crit of CRITERIA) {
                    const count = pCards[crit] || 0;
                    const warn = count >= 2 ? 'danger' : (count === 1 ? 'warning' : '');
                    cardHtml += `<div class="card-ctrl">
                        <button class="card-dec" data-player="${p}" data-crit="${crit}">−</button>
                        <span class="card-count ${warn}">${count}</span>
                        <button class="card-inc" data-player="${p}" data-crit="${crit}">+</button>
                    </div>`;
                }
                cardHtml += `</div>`;
            }

            list.innerHTML = cardHtml;

            const badge = document.getElementById('cardTotalBadge');
            badge.textContent = totalCards;
            badge.classList.toggle('danger', totalCards >= 2);

            list.querySelectorAll('.card-dec').forEach(btn => {
                btn.addEventListener('click', function() {
                    const p = this.dataset.player;
                    const crit = this.dataset.crit;
                    const cur = state.cards[teamId]?.[round]?.[p]?.[crit] || 0;
                    if (cur > 0) {
                        setCard(teamId, round, p, crit, cur - 1);
                        refreshModal(teamId, round);
                    }
                });
            });

            list.querySelectorAll('.card-inc').forEach(btn => {
                btn.addEventListener('click', function() {
                    const p = this.dataset.player;
                    const crit = this.dataset.crit;
                    const cur = state.cards[teamId]?.[round]?.[p]?.[crit] || 0;
                    if (cur < 3) {
                        setCard(teamId, round, p, crit, cur + 1);
                        refreshModal(teamId, round);
                    }
                });
            });

            document.querySelectorAll('.score-dec').forEach(btn => {
                btn.onclick = function() {
                    const crit = this.dataset.crit;
                    const cur = getScore(teamId, round, crit);
                    if (cur > 0) {
                        setScore(teamId, round, crit, cur - 1);
                        refreshModal(teamId, round);
                    }
                };
            });

            document.querySelectorAll('.score-inc').forEach(btn => {
                btn.onclick = function() {
                    const crit = this.dataset.crit;
                    const cur = getScore(teamId, round, crit);
                    if (cur < 3) {
                        setScore(teamId, round, crit, cur + 1);
                        refreshModal(teamId, round);
                    }
                };
            });

            document.getElementById('editModal').classList.add('open');
        }

        function refreshModal(teamId, round) {
            const wasOpen = document.getElementById('editModal').classList.contains('open');
            if (wasOpen) {
                openModal(teamId, round);
            }
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('open');
            renderTable();
            renderLineup();
        }

        // ========================================================================
        //  TOAST
        // ========================================================================

        let toastTimeout = null;

        function showToast(msg, duration = 2000) {
            const el = document.getElementById('toast');
            el.innerHTML = msg;
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                el.classList.remove('show');
            }, duration);
        }

        // ========================================================================
        //  RESET
        // ========================================================================

        function resetAll() {
            if (!confirm('⚠️ Tem certeza que deseja reiniciar todos os dados?')) return;
            state = initState();
            saveState();
            renderTable();
            renderLineup();
            showToast('✅ Dados reiniciados com sucesso!');
        }

        // ========================================================================
        //  TABS
        // ========================================================================

        function initTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const tab = this.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(`tab-${tab}`).classList.add('active');
                });
            });
        }

        // ========================================================================
        //  INIT
        // ========================================================================

        function init() {
            state = getState();
            renderTable();
            renderLineup();
            initTabs();

            document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
            document.getElementById('modalCloseBtn2').addEventListener('click', closeModal);
            document.getElementById('editModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
            document.getElementById('modalSaveBtn').addEventListener('click', closeModal);

            document.getElementById('resetBtn').addEventListener('click', resetAll);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });

            document.getElementById('roundInfo').textContent = `${ROUNDS} rodadas • Outubro 2026`;
            showToast('💾 Dados salvos automaticamente', 1200);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
